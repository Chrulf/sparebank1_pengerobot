transfer_debit:
  name: "Transfer Debit"
  description: "Transfer money between bank accounts using Sparebank1 debit transfer"
  fields:
    device_id:
      name: "Device"
      description: "Sparebank1 device to use for the transfer"
      required: true
      selector:
        device:
          integration: sparebank1_pengerobot
    from_account:
      name: "From Account"
      description: "Select the account to transfer money from"
      required: true
      selector:
        entity:
          integration: sparebank1_pengerobot
          domain: sensor
          device_class: monetary
    to_account:
      name: "To Account"
      description: "Select the account to transfer money to"
      required: true
      selector:
        entity:
          integration: sparebank1_pengerobot
          domain: sensor
          device_class: monetary
    amount:
      name: "Amount"
      description: "Amount to transfer (limited by max_amount configuration)"
      required: true
      example: "100.50"
      selector:
        text:
    currency_code:
      name: "Currency Code"
      description: "Currency for the transfer (defaults to configured default currency). Choosing other currencies than NOK may incur additional transfer costs."
      required: false
      selector:
        select:
          options:
            - "NOK"
            - "EUR"
            - "USD"
            - "SEK"
            - "DKK"
            - "GBP"
    message:
      name: "Message"
      description: "Message for the transfer"
      required: false
      selector:
        text:
    due_date:
      name: "Due Date"
      description: "Due date for the transfer (YYYY-MM-DD format)"
      required: false
      selector:
        date:

transfer_creditcard:
  name: "Transfer Credit Card"
  description: "Transfer money from a bank account to a credit card account using Sparebank1 credit card transfer"
  fields:
    device_id:
      name: "Device"
      description: "Sparebank1 device to use for the transfer"
      required: true
      selector:
        device:
          integration: sparebank1_pengerobot
    from_account:
      name: "From Account"
      description: "Select the account to transfer money from"
      required: true
      selector:
        entity:
          integration: sparebank1_pengerobot
          domain: sensor
          device_class: monetary
    to_account:
      name: "To Account"
      description: "Select the credit card account to transfer money to"
      required: true
      selector:
        entity:
          integration: sparebank1_pengerobot
          domain: sensor
          device_class: monetary
    amount:
      name: "Amount"
      description: "Amount to transfer (limited by max_amount configuration)"
      required: true
      example: "100.50"
      selector:
        text:
    due_date:
      name: "Due Date"
      description: "Due date for the transfer (YYYY-MM-DD format)"
      required: false
      selector:
        date:

refresh:
  name: "Refresh"
  description: "Fetch balances (and transactions, if enabled) from Sparebank1 now. Fails with a message while the bank is rate limiting this client."
  fields:
    device_id:
      name: "Device"
      description: "Sparebank1 device to refresh (all of them if left out)"
      required: false
      selector:
        device:
          integration: sparebank1_pengerobot

get_transactions:
  name: "Get transactions"
  description: "Return the transactions of the last days (one API call). Uses the separate transactions quota of about 60 calls per hour."
  fields:
    device_id:
      name: "Device"
      description: "Sparebank1 device to use (all of them if left out)"
      required: false
      selector:
        device:
          integration: sparebank1_pengerobot
    account:
      name: "Accounts"
      description: "Account sensors to include (all selected accounts if left out)"
      required: false
      selector:
        entity:
          integration: sparebank1_pengerobot
          domain: sensor
          device_class: monetary
          multiple: true
    days:
      name: "Days"
      description: "How many days back to look"
      required: false
      default: 30
      selector:
        number:
          min: 1
          max: 365
          mode: box
